name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1 # v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Asia/Thimphu"
          THEME: "tokyonight"
          ANIMATION: "fade"
          AUTO_PUSH: false

      # Recolour the generated cards to the profile palette:
      # panel #172438, single accent #38BDF8.
      - name: Apply profile palette
        run: |
          sed -i -E \
            -e 's/#1a1b27/#172438/gI' \
            -e 's/#38bdae/#38bdf8/gI' \
            -e 's/#bf91f3/#38bdf8/gI' \
            -e 's/#70a5fd/#7dd3fc/gI' \
            profile-summary-card-output/tokyonight/*.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No card changes"
          else
            git commit -m "Update profile summary cards"
            git push origin HEAD:main
          fi
